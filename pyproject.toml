[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hlp-time-resource-artifact"
version = "1.0.0"
description = "Finite-domain time and resource analysis for hierarchical QEC"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "stim==1.15.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
